
services:
  iasd_app:
    environment:
    - CI=true
    - npm_config_loglevel=error
    - npm_config_progress=false
    - npm_config_fund=false
    - npm_config_audit=false
    image: node:20.14.0  # La imagen que se va a utilizar
    container_name: iasd_app # Nombre del contenedor
    networks:
      red_interna:
        ipv4_address: 192.168.20.14
    hostname: servidor_mariadb
    volumes:
      - /home/juan/Documentos/proyecto_iasd/app:/home/demo # Mapea el volumen de tu directorio local
    ports:
      - "puertoAfueraAPP1:puertoAdentroAPP1" # Mapea el puerto 8080 del host al puerto 80 del contenedor
      - "puertoAfueraAPP2:puertoAdentroAPP2" # Puerto para exponer la maqueta.
      - "puertoAfueraAPP3:puertoAdentroAPP3" # Puerto para exponer el manual de usuario.
    stdin_open: true  # Equivalente a `-it` para tener un contenedor interactivo
    tty: true # Habilita una terminal interactiva
    command: /bin/bash -c "
      cd /home/demo/meca-app && npm run serve -- --port 81 &
      cd /home/demo/mockup && npm run serve -- --port 82 &
      cd /home/demo/user-manual/former-filament && npm run dev -- --port 4321 &
      wait &&
      /bin/bash"  # Ejecuta la secuencia de comandos al iniciar el contenedor
networks:
    red_web:
        ipam:
            config:
              - subnet: 192.168.10.0/24
    red_interna:
        ipam:
            config:
              - subnet: 192.168.20.0/24
